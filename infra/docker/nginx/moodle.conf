# Moodle 5.x : la racine web est public/, pas la racine du dépôt.
server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 256M;

    # Compression : la bande passante est la ressource rare chez nos utilisateurs.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # Interdit l'exécution de PHP dans les répertoires de données.
    location ~ ^/(moodledata|backup)/ { deny all; return 404; }

    # Moodle sert ses fichiers via pluginfile.php / tokenpluginfile.php.
    location ~ ^/(.*\.php)(/.*)?$ {
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        try_files $fastcgi_script_name =404;
        fastcgi_pass moodle-php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Cache long sur les ressources versionnées par Moodle (paramètre ?rev=).
    location ~* \.(css|js|woff2?|ttf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
