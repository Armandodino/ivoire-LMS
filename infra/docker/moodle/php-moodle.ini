; Réglages PHP pour Moodle 5.2 — voir public/admin/environment.xml
; memory_limit >= 96M est une exigence ; 512M est la valeur de travail réelle
; (restauration de cours, génération de rapports).
memory_limit = 512M
max_execution_time = 300
max_input_vars = 5000
post_max_size = 256M
upload_max_filesize = 256M
file_uploads = On

; Moodle exige que ces réglages restent désactivés.
max_input_time = 300
default_charset = UTF-8

; OPcache : Moodle charge des milliers de fichiers PHP par requête.
opcache.enable = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 16000
opcache.revalidate_freq = 2
opcache.use_cwd = 1
opcache.validate_timestamps = 1
opcache.save_comments = 1
