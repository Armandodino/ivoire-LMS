# Environnement de développement Ivoire-LMS — jalon 1.
#
# Profil par défaut (phase 1, cf. docs/adr/0004-phasage-des-moteurs.md) :
#   postgres, valkey, moodle-php, moodle-web, moodle-cron, keycloak, mailpit, garage
# Profil openedx (phase 2, sur demande) : voir infra/compose/README.md
#
# Depuis la racine du dépôt :  make up
name: ivoire-lms

x-restart: &restart
  restart: unless-stopped

services:
  # ─────────────────────────────── Données ───────────────────────────────
  postgres:
    # Moodle 5.2 exige PostgreSQL >= 16, Moodle 5.3 exigera 17.
    # On prend 17 tout de suite pour ne pas avoir à migrer à la montée de version.
    image: postgres:17-alpine
    <<: *restart
    environment:
      POSTGRES_DB: ${MOODLE_DB_NAME:-moodle}
      POSTGRES_USER: ${MOODLE_DB_USER:-moodle}
      POSTGRES_PASSWORD: ${MOODLE_DB_PASSWORD:?MOODLE_DB_PASSWORD manquant dans .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MOODLE_DB_USER:-moodle} -d ${MOODLE_DB_NAME:-moodle}"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  valkey:
    # Valkey plutôt que Redis : BSD-3-Clause sous gouvernance Linux Foundation,
    # là où Redis 8 est AGPLv3. Cohérent avec notre stratégie de limiter
    # l'exposition au copyleft (cf. ADR 0004 et ADR 0005). Compatible au niveau
    # protocole : l'extension phpredis et le gestionnaire de sessions Moodle
    # fonctionnent sans modification.
    image: valkey/valkey:9.0-alpine
    <<: *restart
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ────────────────────────────── Moodle 5.2 ─────────────────────────────
  moodle-php:
    build:
      context: ../..
      dockerfile: infra/docker/moodle/Dockerfile
    <<: *restart
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      MOODLE_DB_HOST: postgres
      MOODLE_DB_NAME: ${MOODLE_DB_NAME:-moodle}
      MOODLE_DB_USER: ${MOODLE_DB_USER:-moodle}
      MOODLE_DB_PASSWORD: ${MOODLE_DB_PASSWORD:?}
      MOODLE_WWWROOT: ${MOODLE_WWWROOT:-http://localhost:8080}
      MOODLE_REDIS_HOST: valkey
      MOODLE_SMTP_HOST: mailpit:1025
      MOODLE_DEBUG: ${MOODLE_DEBUG:-true}
      # Configuration BBB injectée par platform/integrations/bbb (jalon 4).
      BBB_SERVER_URL: ${BBB_SERVER_URL:-}
      BBB_SHARED_SECRET: ${BBB_SHARED_SECRET:-}
    volumes:
      # Le sous-module est monté en lecture-écriture : on développe des plugins,
      # on ne modifie pas le cœur (cf. engines/README.md).
      - ../../engines/moodle:/var/www/html
      # config.php lit son contenu depuis l'environnement, aucun secret en dur.
      # En Moodle 5 il vit à la RACINE : public/config.php n'est qu'un chargeur.
      - ../docker/moodle/config.php:/var/www/html/config.php:ro
      - moodledata:/var/www/moodledata
      # Pas de montage de plugins/moodle pour l'instant : un répertoire placé
      # dans public/local/ sans version.php n'est pas un plugin valide pour
      # Moodle, qui lit version.php pour chaque plugin détecté. Tant que nous
      # n'avons écrit aucun plugin, ce montage n'apporterait rien et pourrait
      # faire échouer l'installation ou une montée de version. On ajoutera un
      # montage précis, par plugin, quand le premier existera :
      #   - ../../plugins/moodle/local_ivoire:/var/www/html/public/local/ivoire:ro

  moodle-web:
    image: nginx:1.30-alpine
    <<: *restart
    depends_on: [moodle-php]
    volumes:
      - ../../engines/moodle:/var/www/html:ro
      - ../../infra/docker/nginx/moodle.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${MOODLE_PORT:-8080}:80"

  moodle-cron:
    build:
      context: ../..
      dockerfile: infra/docker/moodle/Dockerfile
    <<: *restart
    depends_on: [moodle-php]
    # Moodle exige l'exécution du cron toutes les minutes, sinon files d'attente,
    # notifications et sauvegardes automatiques ne partent jamais.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          php /var/www/html/admin/cli/cron.php >/proc/1/fd/1 2>&1 || true
          sleep 60
        done
    environment:
      MOODLE_DB_HOST: postgres
      MOODLE_DB_NAME: ${MOODLE_DB_NAME:-moodle}
      MOODLE_DB_USER: ${MOODLE_DB_USER:-moodle}
      MOODLE_DB_PASSWORD: ${MOODLE_DB_PASSWORD:?}
      MOODLE_WWWROOT: ${MOODLE_WWWROOT:-http://localhost:8080}
      MOODLE_REDIS_HOST: valkey
      BBB_SERVER_URL: ${BBB_SERVER_URL:-}
      BBB_SHARED_SECRET: ${BBB_SHARED_SECRET:-}
    volumes:
      - ../../engines/moodle:/var/www/html
      - ../docker/moodle/config.php:/var/www/html/config.php:ro
      - moodledata:/var/www/moodledata

  # ───────────────────── Identité unique (jalon 2) ──────────────────────
  keycloak:
    # 26.7.4 (16/09/2026) : seule la ligne 26.7 est maintenue, et elle corrige
    # des CVE dont une élévation de privilèges. Ne pas rester sur 26.0.
    image: quay.io/keycloak/keycloak:26.7.4
    <<: *restart
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD manquant dans .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${MOODLE_DB_USER:-moodle}
      KC_DB_PASSWORD: ${MOODLE_DB_PASSWORD:?}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ../keycloak:/opt/keycloak/data/import:ro
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"

  # ───────────────────── Outils de développement ───────────────────────
  mailpit:
    # Moodle envoie beaucoup de courriels ; on les intercepte au lieu de les
    # envoyer réellement pendant le développement.
    image: axllent/mailpit:v1.31.2
    <<: *restart
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

  garage:
    # Remplace MinIO, dont le dépôt communautaire a été ARCHIVÉ le 25/04/2026
    # ("THIS REPOSITORY IS NO LONGER MAINTAINED", plus de binaires publiés).
    # Garage est écrit en Rust par Deuxfleurs, tourne sur du matériel modeste,
    # tolère 200 ms de latence entre nœuds et réplique sur plusieurs sites :
    # exactement la contrainte d'une infrastructure répartie en Côte d'Ivoire.
    image: dxflrs/garage:v2.4.1
    <<: *restart
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET manquant dans .env}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?GARAGE_ADMIN_TOKEN manquant dans .env}
    volumes:
      - ../docker/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports:
      - "${GARAGE_S3_PORT:-3900}:3900"
      - "${GARAGE_ADMIN_PORT:-3903}:3903"

volumes:
  postgres-data:
  valkey-data:
  moodledata:
  garage-meta:
  garage-data:
